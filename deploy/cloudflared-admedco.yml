# ═══════════════════════════════════════════════════════════
# TUNNEL CLOUDFLARE DÉDIÉ À ADMEDCO
#
# ⚠️  CE FICHIER N'EST PAS /etc/cloudflared/config.yml
#
#     /etc/cloudflared/config.yml sert les deux applications déjà en
#     production (wa-gateway:3000 et rmasc-onsite:4002). Il ne doit être
#     ni édité, ni fusionné avec celui-ci : une virgule de travers dans
#     config.yml coupe les DEUX applications d'un coup.
#
#     Ce tunnel-ci est totalement indépendant :
#       • son propre ID de tunnel
#       • son propre fichier de credentials
#       • son propre service systemd (cloudflared-admedco.service)
#     Il peut être démarré, arrêté ou rechargé sans aucun effet sur les
#     deux autres applications.
#
# La cible est l'application Next.js elle-même (127.0.0.1:4003) :
# nginx n'intervient pas dans cette chaîne, /etc/nginx/sites-enabled/
# n'est donc pas modifié non plus.
#
#   Internet → Cloudflare Edge → cloudflared (ce fichier) → 127.0.0.1:4003
#
# Domaine : admedco.com (racine) + www.admedco.com.
#
# La cible DNS à créer dans Cloudflare est le CNAME :
#   9c8f8ce5-4c53-4b45-9f44-9d2dc39aab55.cfargotunnel.com
#
# ⚠️ Sur Cloudflare, un CNAME à la racine est autorisé (CNAME flattening).
#    Ne toucher QUE l'enregistrement web (A/AAAA/CNAME) du nom concerné.
#    Les enregistrements MX (messagerie) ne sont pas concernés par ce
#    changement : si admedco.com a des mails dessus, ils continuent de
#    fonctionner.
# ═══════════════════════════════════════════════════════════

# ID du tunnel (UUID) — n'est pas un secret, il apparaît dans les logs et le DNS.
tunnel: 9c8f8ce5-4c53-4b45-9f44-9d2dc39aab55
credentials-file: /etc/cloudflared/9c8f8ce5-4c53-4b45-9f44-9d2dc39aab55.json

# Réglages appliqués à toutes les règles d'ingress ci-dessous.
originRequest:
  # Next.js compile certaines pages à la première requête : sur un serveur
  # chargé, 15 s (défaut cloudflared) peut suffire à renvoyer une 502 à un
  # ouvrier devant son poste. On laisse de la marge.
  connectTimeout: 30s
  # Pas de keepalive agressif : le trafic atelier est bruité et intermittent.
  tcpKeepAlive: 30s

ingress:
  # ── Application ADMEDCO ──
  # Les trois noms pointent vers la même application. Une règle dont le
  # hostname n'a pas d'enregistrement DNS est simplement jamais atteinte :
  # elle ne gêne rien. Cela évite d'être bloqué par un enregistrement
  # préexistant sur la racine du domaine — le sous-domaine `erp` est
  # toujours libre et suffit à démarrer.
  - hostname: admedco.com
    service: http://127.0.0.1:4003

  - hostname: www.admedco.com
    service: http://127.0.0.1:4003

  - hostname: erp.admedco.com
    service: http://127.0.0.1:4003

  # ── Règle de repli OBLIGATOIRE ──
  # cloudflared REFUSE de démarrer si la dernière règle porte un `hostname`.
  # Elle sert aussi de garde-fou : un hostname non prévu reçoit un 404 au
  # lieu d'atteindre une application.
  - service: http_status:404
